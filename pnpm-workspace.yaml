packages:
  - frontend
  - backend
  - packages/*
overrides:
  # GHSA-ggr8-5vv4-36mx; Prisma config's deepmerge API is verified by migration/build tests.
  deepmerge-ts: 8.0.0
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true
minimumReleaseAgeExclude:
  - lucide-react@1.72.0
  - prettier@3.10.0
  - '@hookform/resolvers@7.0.6'
  - react-hook-form@7.92.0
